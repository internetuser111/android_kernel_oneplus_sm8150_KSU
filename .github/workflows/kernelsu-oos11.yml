name: Build OnePlus-Sm8150-SukiSU-Ultra-NetHunter
on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *'
  push:
    branches:
      - oneplus/OOS_SM8150_11.0
  pull_request:
    branches:
      - oneplus/OOS_SM8150_11.0

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "4G"
      CCACHE_HARDLINK: "true"
      KERNEL_DEFCONFIG: "blu_spark_defconfig"

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 0

    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1.2

    - name: Free up disk space
      run: |
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        sudo rm -rf /usr/local/lib/android
        df -h

    - name: Install dependencies
      run: |
        sudo apt-get update -y 
        sudo apt-get install -y \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          binutils make python3 python3-pip \
          libssl-dev build-essential bc bison flex \
          unzip ca-certificates xz-utils mkbootimg \
          cpio device-tree-compiler git git-lfs \
          dos2unix libelf-dev wget curl zip

    - name: Clone Proton Clang Toolchain
      run: |
        mkdir -p toolchain
        cd toolchain
        wget -q https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.zip -O proton.zip
        unzip -q proton.zip
        mv proton-clang-master proton-clang
        rm proton.zip

    - name: Clone AnyKernel3
      run: |
        git clone https://github.com/snowwolf725/AnyKernel3 -b oneplus7 --depth=1
        rm -rf AnyKernel3/.git

    - name: Setup SukiSU Ultra
      run: |
        # Remove old KernelSU if exists
        rm -rf ./KernelSU
        rm -rf ./drivers/kernelsu
        
        # Setup SukiSU Ultra with SUSFS support (for non-GKI)
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-main
        
        # Verify setup
        if [ -d "KernelSU" ]; then
          echo "SukiSU Ultra setup successful"
          ls -la KernelSU/
        else
          echo "SukiSU Ultra setup failed!"
          exit 1
        fi

    - name: Clone RTL8812AU Driver (NetHunter WiFi Injection)
      run: |
        git clone https://github.com/aircrack-ng/rtl8812au drivers/net/wireless/rtl8812au --depth=1
        rm -rf drivers/net/wireless/rtl8812au/.git
        
        # Add to wireless Makefile
        echo "obj-\$(CONFIG_88XXAU) += rtl8812au/" >> drivers/net/wireless/Makefile
        
        # Add to wireless Kconfig
        sed -i '/endmenu/i source "drivers/net/wireless/rtl8812au/Kconfig"' drivers/net/wireless/Kconfig

    - name: Apply Kernel Configs
      run: |
        DEFCONFIG_PATH="arch/arm64/configs/$KERNEL_DEFCONFIG"
        
        # Backup original
        cp $DEFCONFIG_PATH ${DEFCONFIG_PATH}.backup
        
        cat >> $DEFCONFIG_PATH << 'EOF'

# ================================
# SukiSU Ultra Configuration
# ================================
CONFIG_KSU=y
CONFIG_KSU_MANUAL_HOOK=y
CONFIG_KALLSYMS=y
CONFIG_KALLSYMS_ALL=y

# ================================
# WiFi Driver Fixes (QCACLD 3.0)
# ================================
CONFIG_QCA_CLD_WLAN=y
CONFIG_CNSS2=y
CONFIG_CNSS2_QMI=y
CONFIG_ICNSS2=y
CONFIG_ICNSS2_QMI=y
CONFIG_QCACLD_WLAN_LFR3=y
CONFIG_PRIMA_WLAN_OKC=y
CONFIG_WLAN_FEATURE_11W=y
# CONFIG_QCACLD_FEATURE_NAN is not set

# ================================
# NetHunter - Wireless Extensions
# ================================
CONFIG_CFG80211=y
CONFIG_CFG80211_WEXT=y
CONFIG_CFG80211_WEXT_EXPORT=y
CONFIG_MAC80211=y
CONFIG_MAC80211_MESH=y
CONFIG_WIRELESS_EXT=y
CONFIG_WEXT_CORE=y
CONFIG_WEXT_PROC=y
CONFIG_WEXT_SPY=y
CONFIG_WEXT_PRIV=y

# ================================
# NetHunter - RTL8812AU Driver
# ================================
CONFIG_88XXAU=y
CONFIG_RTL8812AU=y
CONFIG_RTL8821AU=y

# ================================
# NetHunter - USB Gadget & HID
# ================================
CONFIG_USB_GADGET=y
CONFIG_USB_CONFIGFS=y
CONFIG_USB_CONFIGFS_F_HID=y
CONFIG_USB_CONFIGFS_RNDIS=y
CONFIG_USB_CONFIGFS_ECM=y
CONFIG_USB_CONFIGFS_EEM=y
CONFIG_USB_CONFIGFS_MASS_STORAGE=y
CONFIG_USB_CONFIGFS_F_FS=y
CONFIG_USB_CONFIGFS_F_ACC=y
CONFIG_USB_CONFIGFS_F_AUDIO_SRC=y
CONFIG_USB_CONFIGFS_UEVENT=y
CONFIG_USB_G_HID=y

# ================================
# NetHunter - Input/HID Support
# ================================
CONFIG_UHID=y
CONFIG_HID=y
CONFIG_HIDRAW=y
CONFIG_HID_GENERIC=y

# ================================
# NetHunter - SDR Support (Optional)
# ================================
CONFIG_USB_ACM=y
CONFIG_USB_SERIAL=y
CONFIG_USB_SERIAL_GENERIC=y
CONFIG_USB_SERIAL_CH341=y
CONFIG_USB_SERIAL_CP210X=y
CONFIG_USB_SERIAL_FTDI_SIO=y
CONFIG_USB_SERIAL_PL2303=y

# ================================
# NetHunter - Bluetooth Support
# ================================
CONFIG_BT=y
CONFIG_BT_RFCOMM=y
CONFIG_BT_RFCOMM_TTY=y
CONFIG_BT_BNEP=y
CONFIG_BT_HIDP=y
CONFIG_BT_HCIBTUSB=y
CONFIG_BT_HCIUART=y

# ================================
# NetHunter - Additional Features
# ================================
CONFIG_NETFILTER=y
CONFIG_NETFILTER_ADVANCED=y
CONFIG_IP_NF_TARGET_TTL=y
CONFIG_CIFS=y
CONFIG_NLS_UTF8=y

EOF
        
        echo "Configs added to defconfig"

    - name: Fix Kconfig Line Endings
      run: |
        find ./ -name "Kconfig*" -exec dos2unix {} \; 2>/dev/null || true
        find ./ -name "Makefile*" -exec dos2unix {} \; 2>/dev/null || true

    - name: Build Kernel
      run: |
        # Setup toolchain paths
        PROTON_PATH="${PWD}/toolchain/proton-clang"
        export PATH="${PROTON_PATH}/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export BRAND_SHOW_FLAG=oneplus
        export TARGET_PRODUCT=msmnile
        
        # Build arguments
        MAKE_ARGS="
          ARCH=arm64
          SUBARCH=arm64
          O=out
          CC=clang
          CLANG_TRIPLE=aarch64-linux-gnu-
          CROSS_COMPILE=aarch64-linux-gnu-
          CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          LD=ld.lld
          AR=llvm-ar
          NM=llvm-nm
          OBJCOPY=llvm-objcopy
          OBJDUMP=llvm-objdump
          STRIP=llvm-strip
          LLVM=1
          LLVM_IAS=1
        "
        
        # Generate defconfig
        echo "==> Generating defconfig..."
        make $MAKE_ARGS $KERNEL_DEFCONFIG 2>&1 | tee defconfig.log
        
        # Build kernel
        echo "==> Building kernel..."
        make $MAKE_ARGS -j$(nproc --all) 2>&1 | tee build.log
        
        # Check if Image exists
        if [ -f "out/arch/arm64/boot/Image" ]; then
          echo "==> Kernel build successful!"
          cp out/arch/arm64/boot/Image AnyKernel3/
        else
          echo "==> Kernel build FAILED!"
          echo "Last 100 lines of build log:"
          tail -100 build.log
          exit 1
        fi
        
        # Copy DTBs if exists
        if [ -f "out/arch/arm64/boot/dtb" ]; then
          cp out/arch/arm64/boot/dtb AnyKernel3/
        fi
        
        # Copy DTBO if exists
        if [ -f "out/arch/arm64/boot/dtbo.img" ]; then
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/
        fi

    - name: Create Flashable ZIP
      run: |
        cd AnyKernel3
        ZIP_NAME="OP7-OOS11-SukiSU-Ultra-NetHunter-$(date +%Y%m%d).zip"
        zip -r9 "../${ZIP_NAME}" * -x '*.git*'
        cd ..
        echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
        echo "Created: ${ZIP_NAME}"

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OP7-OOS11-SukiSU-Ultra-NetHunter
        path: |
          AnyKernel3/*
          *.zip

    - name: Upload Build Logs (on failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          *.log
          out/.config
          
